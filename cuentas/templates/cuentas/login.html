<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - GymAccess</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #0f172a;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 0.75rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid #334155;
        }

        .brand-header {
            background-color: #1e293b;
            color: #ffffff;
            border-top-left-radius: 0.75rem;
            border-top-right-radius: 0.75rem;
            padding: 1.5rem;
            text-align: center;
        }

        .form-control:focus {
            border-color: #0284c7;
            box-shadow: 0 0 0 0.25rem rgba(2, 132, 199, 0.2);
        }
    </style>
</head>

<body>

    <div class="login-card">
        <div class="brand-header">
            <div
                class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-25 rounded-circle p-3 mb-2">
                <i class="bi bi-shield-lock text-info fs-3"></i>
            </div>
            <h4 class="fw-bold mb-1">GymAccess Pro</h4>
            <p class="text-secondary small mb-0">Sistema de Gestión y Control de Accesos</p>
        </div>

        <div class="p-4">
            {% if form.errors %}
            <div class="alert alert-danger py-2 small mb-3">
                <i class="bi bi-exclamation-circle-fill me-1"></i>
                Usuario o contraseña incorrectos. Por favor verifique sus credenciales.
            </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="id_username" class="form-label small fw-semibold text-secondary">Usuario</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-secondary border-end-0">
                            <i class="bi bi-person"></i>
                        </span>
                        <input type="text" name="username" autofocus required id="id_username"
                            class="form-control border-start-0" placeholder="Ingrese su usuario">
                    </div>
                </div>

                <div class="mb-4">
                    <label for="id_password" class="form-label small fw-semibold text-secondary">Contraseña</label>
                    <div class="input-group">
                        <span class="input-group-text bg-light text-secondary border-end-0">
                            <i class="bi bi-key"></i>
                        </span>
                        <input type="password" name="password" required id="id_password"
                            class="form-control border-start-0" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold shadow-sm">
                    <i class="bi bi-box-arrow-in-right me-1"></i> Iniciar Sesión
                </button>
            </form>
        </div>

        <div class="text-center pb-3 text-muted small">
            <span>Acceso seguro con QR dinámico</span>
        </div>
    </div>

</body>

</html>
